<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Street Chaves Rust</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101522; color: #f4f2eb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; }
    main { width: min(100%, 900px); display: grid; justify-items: center; gap: 1rem; }
    canvas {
      display: block;
      width: min(100%, 800px);
      height: auto;
      aspect-ratio: 4 / 3;
      background: #090d16;
      image-rendering: pixelated;
      border: 1px solid #38445b;
    }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
    button { border: 1px solid #677996; border-radius: .5rem; padding: .65rem 1rem; background: #25334b; color: inherit; font: inherit; cursor: pointer; }
    button:hover { background: #344765; }
    #diagnostics { width: min(100%, 800px); min-height: 1.5rem; white-space: pre-wrap; overflow-wrap: anywhere; color: #b8c7dd; font: 12px/1.5 ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <canvas id="street-chaves" width="400" height="300" aria-label="Street Chaves Rust game"></canvas>
    <div class="controls">
      <button id="enable-audio" type="button">Enable audio</button>
    </div>
    <pre id="diagnostics" aria-live="polite">Loading Street Chaves Rust…</pre>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
