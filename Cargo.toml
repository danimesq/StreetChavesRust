[package]
name = "street-chaves-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Evidence-driven Rust reconstruction of Street Chaves combat rules"
license = "MIT"

[lib]
name = "street_chaves"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl3 = { version = "0.22.1", features = ["build-from-source"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
