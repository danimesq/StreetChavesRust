[package]
name = "street-chaves-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Evidence-driven Rust reconstruction of Street Chaves combat rules"
license = "MIT"

[lib]
name = "street_chaves"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
native-foundation = ["foundation-runtime/native-sdl3"]
web-foundation = ["foundation-runtime/web-canvas"]

[dependencies]
serde_json = "1"
foundation-runtime = { git = "https://github.com/danimesq/RustMultiConsoleFoundation", branch = "main", package = "foundation-runtime" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]

[[bin]]
name = "street-chaves-native"
path = "src/bin/street-chaves-native.rs"
required-features = ["native-foundation"]
