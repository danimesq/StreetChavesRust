name: Rust contracts

on:
  push:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/rust-contracts.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/rust-contracts.yml"

permissions:
  contents: read

jobs:
  test:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply Rust formatting
        run: cargo fmt --all
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run contract tests
        run: cargo test --all-targets
      - name: Emit formatted source for repository patch
        if: always()
        run: |
          echo "BEGIN_FORMATTED_SRC_LIB"
          cat src/lib.rs
          echo "END_FORMATTED_SRC_LIB"
          echo "BEGIN_FORMATTED_TESTS"
          cat tests/combat_contracts.rs
          echo "END_FORMATTED_TESTS"
