name: Rust contracts

on:
  push:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - "FoundationWebBuild.toml"
      - "web/**"
      - "scripts/**"
      - "research/pascal-effects/**"
      - "docs/web-custom-character-manifest.md"
      - "docs/CHS-SCREEN-STATUS.md"
      - ".github/workflows/rust-contracts.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - "FoundationWebBuild.toml"
      - "web/**"
      - "scripts/**"
      - "research/pascal-effects/**"
      - "docs/web-custom-character-manifest.md"
      - "docs/CHS-SCREEN-STATUS.md"
      - ".github/workflows/rust-contracts.yml"

permissions:
  contents: read

jobs:
  test:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Install SDL build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build pkg-config
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Fetch original game resource sources
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/danimesq/OpenStreetChaves.git ../OpenStreetChaves
          git -C ../OpenStreetChaves sparse-checkout init --no-cone
          git -C ../OpenStreetChaves sparse-checkout set /Cenarios/ /Lutadores/ /Dados/ /Sons/ /Musicas/ /Falas/ /Efeitos/ /Embutidos/Musica.wav /LICENSE
          git -C ../OpenStreetChaves checkout
      - name: Validate Foundation Web build manifest and source files
        run: |
          bash -n scripts/build-web.sh
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("FoundationWebBuild.toml").read_text())
          assert config["schema-version"] == 1
          source_root = Path(config["assets-root"]).resolve()
          assets = config["assets"]
          ids = [asset["id"] for asset in assets]
          assert len(ids) == len(set(ids)), "duplicate resource IDs in FoundationWebBuild.toml"
          missing = [
              asset["source"]
              for asset in assets
              if not (source_root / asset["source"]).is_file()
          ]
          assert not missing, "missing OpenStreetChaves source assets: " + ", ".join(missing)
          assert len(assets) == 280, f"expected 280 configured resources, found {len(assets)}"
          ids_set = set(ids)
          assert "effect_catalog" in ids_set
          assert all(f"effect_sprite_{slot:03}" in ids_set for slot in range(1, 112))
          assert all(f"fight_music_{slot:03}" in ids_set for slot in range(2, 7))
          assert all(
              f"victory_voice_{fighter:02}_{variant}" in ids_set
              for fighter in range(1, 17)
              for variant in ("a", "b")
          )
          print(f"Validated {len(assets)} source assets from {source_root}")
          PY
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run contract tests with the Foundation native host
        run: cargo test --all-targets --features native-foundation
      - name: Check WebAssembly Canvas 2D and WebAudio build
        run: cargo check --target wasm32-unknown-unknown --features web-foundation
      - name: Check the Foundation source-to-Web publish pipeline
        run: |
          git clone --depth 1 --branch foundation-web-build-pipeline https://github.com/danimesq/RustMultiConsoleFoundation.git ../RustMultiConsoleFoundation
          wasm_bindgen_version="$(cargo tree -p street-chaves-rust --target wasm32-unknown-unknown --prefix none -i wasm-bindgen | sed -n 's/^wasm-bindgen v//p' | head -n 1)"
          test -n "$wasm_bindgen_version"
          cargo install wasm-bindgen-cli --version "$wasm_bindgen_version" --locked
          bash scripts/build-web.sh
          test -f dist/street-chaves-web/index.html
          test -f dist/street-chaves-web/main.js
          test -f dist/street-chaves-web/web-export.json
          test -f dist/street-chaves-web/web-build-provenance.json
          test -f dist/street-chaves-web/pkg/street_chaves.js
          test -f dist/street-chaves-web/pkg/street_chaves_bg.wasm
          test -f dist/street-chaves-web/licenses/OpenStreetChaves-GPL-3.0.txt
          test -f dist/street-chaves-web.zip
          grep -q 'id="enable-audio"' dist/street-chaves-web/index.html
          grep -q 'id="diagnostics"' dist/street-chaves-web/index.html
