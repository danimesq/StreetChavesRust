name: Rust contracts

on:
  push:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/rust-contracts.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/rust-contracts.yml"

permissions:
  contents: write

jobs:
  test:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install SDL build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build pkg-config
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Temporarily format the native startup branch
        if: github.ref == 'refs/heads/feat/first-playable-native-loop-pr38'
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "style: format native startup executable"
            git push origin HEAD:feat/first-playable-native-loop-pr38
          fi
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run contract tests with the Foundation native host
        run: cargo test --all-targets --features native-foundation
      - name: Check WebAssembly build
        run: cargo check --target wasm32-unknown-unknown
