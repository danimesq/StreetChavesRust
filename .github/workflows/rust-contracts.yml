name: Rust contracts

on:
  push:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/rust-contracts.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/rust-contracts.yml"

permissions:
  contents: read

jobs:
  test:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install SDL build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build pkg-config
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run contract tests with the Foundation native host
        run: cargo test --all-targets --features native-foundation
      - name: Check WebAssembly build
        run: cargo check --target wasm32-unknown-unknown
